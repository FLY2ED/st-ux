<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>오늘의 날씨</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
  :root {
    --bg: #dfe9f3;
    --ink: #111;
    --line: color-mix(in srgb, var(--ink) 14%, transparent);
    --muted: color-mix(in srgb, var(--ink) 55%, transparent);
    --sans: "Pretendard Variable", Pretendard, -apple-system, system-ui, sans-serif;
  }

  body[data-sky="clear"] { --bg: #ffd977; }
  body[data-sky="cloud"] { --bg: #d6dbe1; }
  body[data-sky="fog"] { --bg: #e8e6e1; }
  body[data-sky="rain"] { --bg: #9fb4c7; }
  body[data-sky="snow"] { --bg: #f4f7fb; }
  body[data-sky="storm"] { --bg: #4a4f5c; --ink: #f2f2f7; }
  body.night { --bg: #12141f; --ink: #f2f2f7; }

  * {
    box-sizing: border-box;
  }

  body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--sans);
    transition: background .8s, color .8s;
  }

  button {
    font: inherit;
    color: inherit;
  }

  main {
    max-width: 1000px;
    margin: 0 auto;
    padding: 12vh 32px 64px;
  }

  header {
    display: flex;
    flex-wrap: wrap;
    align-items: baseline;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 40px;
    color: var(--muted);
    font-size: 16px;
  }

  #locate {
    padding: 8px 14px;
    border: 1px solid var(--line);
    border-radius: 999px;
    background: transparent;
    cursor: pointer;
  }

  #locate:hover {
    background: var(--line);
  }

  .now {
    display: flex;
    flex-wrap: wrap;
    align-items: flex-end;
    gap: 8px 40px;
  }

  #temp {
    font-size: clamp(96px, 20vw, 220px);
    font-weight: 700;
    line-height: .9;
    letter-spacing: -.06em;
  }

  #label {
    padding-bottom: .4em;
    font-size: clamp(36px, 7vw, 88px);
    font-weight: 700;
    line-height: 1.1;
    letter-spacing: -.05em;
  }

  #summary {
    margin: 24px 0 56px;
    color: var(--muted);
    font-size: 20px;
  }

  dl {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
    gap: 0;
    margin: 0 0 56px;
    border-top: 1px solid var(--line);
  }

  dl div {
    padding: 20px 0;
    border-bottom: 1px solid var(--line);
  }

  dt {
    margin-bottom: 6px;
    color: var(--muted);
    font-size: 14px;
  }

  dd {
    margin: 0;
    font-size: 28px;
    font-weight: 700;
    letter-spacing: -.03em;
  }

  #hours {
    display: flex;
    gap: 28px;
    overflow-x: auto;
    padding-bottom: 12px;
    list-style: none;
    margin: 0;
    padding-left: 0;
  }

  #hours li {
    flex: none;
    text-align: center;
  }

  #hours span {
    display: block;
  }

  #hours .h {
    color: var(--muted);
    font-size: 14px;
  }

  #hours .i {
    margin: 8px 0;
    font-size: 28px;
  }

  #hours .t {
    font-weight: 700;
  }

  footer {
    margin-top: 48px;
    color: var(--muted);
    font-size: 13px;
  }

  footer a {
    color: inherit;
  }
</style>
</head>
<body>
<main>
  <header>
    <span id="place">불러오는 중…</span>
    <button id="locate" type="button">내 위치로 보기</button>
  </header>

  <section class="now" aria-live="polite">
    <span id="temp">--°</span>
    <span id="label"></span>
  </section>
  <p id="summary"></p>

  <dl>
    <div><dt>체감</dt><dd id="feels">-</dd></div>
    <div><dt>최고 / 최저</dt><dd id="range">-</dd></div>
    <div><dt>강수 확률</dt><dd id="pop">-</dd></div>
    <div><dt>습도</dt><dd id="humid">-</dd></div>
    <div><dt>바람</dt><dd id="wind">-</dd></div>
    <div><dt>일출 / 일몰</dt><dd id="sun">-</dd></div>
  </dl>

  <ol id="hours" aria-label="시간별 예보"></ol>

  <footer>날씨 데이터 <a href="https://open-meteo.com/" target="_blank" rel="noopener">Open-Meteo</a></footer>
</main>

<script>
  const SEOUL = { lat: 37.5665, lon: 126.978, name: '서울' };

  const CODES = [
    [[0], '맑음', '☀️', '🌙', 'clear'],
    [[1], '대체로 맑음', '🌤️', '🌙', 'clear'],
    [[2], '구름 조금', '⛅', '☁️', 'cloud'],
    [[3], '흐림', '☁️', '☁️', 'cloud'],
    [[45, 48], '안개', '🌫️', '🌫️', 'fog'],
    [[51, 53, 55, 56, 57], '이슬비', '🌦️', '🌧️', 'rain'],
    [[61, 63, 65, 66, 67, 80, 81, 82], '비', '🌧️', '🌧️', 'rain'],
    [[71, 73, 75, 77, 85, 86], '눈', '🌨️', '🌨️', 'snow'],
    [[95, 96, 99], '뇌우', '⛈️', '⛈️', 'storm'],
  ];

  function describe(code, isDay = true) {
    const row = CODES.find(([list]) => list.includes(code)) || CODES[3];
    return { label: row[1], icon: isDay ? row[2] : row[3], sky: row[4] };
  }

  const $ = (id) => document.getElementById(id);
  const round = (n) => Math.round(n);
  const clock = (iso) => iso.slice(11, 16);

  function summarize(cur, day) {
    const gap = day.temperature_2m_max[0] - day.temperature_2m_min[0];
    const pop = day.precipitation_probability_max[0];
    const tips = [];
    if (pop >= 60) tips.push('우산 꼭 챙기세요');
    else if (pop >= 30) tips.push('작은 우산이 있으면 좋아요');
    if (gap >= 10) tips.push('일교차가 커요');
    if (cur.apparent_temperature <= 5) tips.push('두꺼운 외투가 필요해요');
    else if (cur.apparent_temperature >= 28) tips.push('더위 조심하세요');
    return tips.length ? tips.join(' · ') : '나가기 좋은 날씨예요';
  }

  async function load({ lat, lon, name }) {
    $('place').textContent = `${name} · 불러오는 중…`;
    const url = 'https://api.open-meteo.com/v1/forecast'
      + `?latitude=${lat}&longitude=${lon}`
      + '&current=temperature_2m,apparent_temperature,relative_humidity_2m,weather_code,wind_speed_10m,is_day'
      + '&hourly=temperature_2m,weather_code,is_day'
      + '&daily=temperature_2m_max,temperature_2m_min,precipitation_probability_max,sunrise,sunset'
      + '&forecast_days=2&timezone=auto';

    try {
      const res = await fetch(url);
      if (!res.ok) throw new Error(res.status);
      render(await res.json(), name);
    } catch (err) {
      $('place').textContent = `${name} · 날씨를 불러오지 못했어요`;
    }
  }

  function render(data, name) {
    const cur = data.current;
    const day = data.daily;
    const now = describe(cur.weather_code, cur.is_day);

    document.body.dataset.sky = now.sky;
    document.body.classList.toggle('night', !cur.is_day);

    const date = new Date(cur.time).toLocaleDateString('ko-KR', { month: 'long', day: 'numeric', weekday: 'long' });
    $('place').textContent = `${name} · ${date} ${clock(cur.time)} 기준`;
    $('temp').textContent = `${round(cur.temperature_2m)}°`;
    $('label').textContent = `${now.icon} ${now.label}`;
    $('summary').textContent = summarize(cur, day);

    $('feels').textContent = `${round(cur.apparent_temperature)}°`;
    $('range').textContent = `${round(day.temperature_2m_max[0])}° / ${round(day.temperature_2m_min[0])}°`;
    $('pop').textContent = `${day.precipitation_probability_max[0] ?? 0}%`;
    $('humid').textContent = `${cur.relative_humidity_2m}%`;
    $('wind').textContent = `${(cur.wind_speed_10m / 3.6).toFixed(1)}m/s`;
    $('sun').textContent = `${clock(day.sunrise[0])} / ${clock(day.sunset[0])}`;

    const h = data.hourly;
    const start = h.time.findIndex((t) => t.slice(0, 13) === cur.time.slice(0, 13));
    $('hours').innerHTML = h.time.slice(start, start + 12).map((t, k) => {
      const i = start + k;
      const w = describe(h.weather_code[i], h.is_day[i]);
      return `<li><span class="h">${k ? `${+t.slice(11, 13)}시` : '지금'}</span>`
        + `<span class="i" title="${w.label}">${w.icon}</span>`
        + `<span class="t">${round(h.temperature_2m[i])}°</span></li>`;
    }).join('');
  }

  function locate() {
    if (!navigator.geolocation) return load(SEOUL);
    $('place').textContent = '위치 확인 중…';
    navigator.geolocation.getCurrentPosition(
      ({ coords }) => load({ lat: coords.latitude.toFixed(3), lon: coords.longitude.toFixed(3), name: '내 위치' }),
      () => load(SEOUL),
      { timeout: 8000, maximumAge: 600000 },
    );
  }

  $('locate').addEventListener('click', locate);
  load(SEOUL);
</script>
</body>
</html>
