<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>보이지 않는 바람</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
  :root {
    --bg: #0b0b12;
    --ink: #f2f2f7;
    --surface: color-mix(in srgb, var(--bg) 74%, transparent);
    --line: color-mix(in srgb, var(--ink) 14%, transparent);
    --muted: color-mix(in srgb, var(--ink) 55%, transparent);
    --hover: color-mix(in srgb, var(--ink) 8%, transparent);
    --sans: "Pretendard Variable", Pretendard, -apple-system, system-ui, sans-serif;
  }

  * {
    box-sizing: border-box;
  }

  html,
  body {
    height: 100%;
  }

  body {
    margin: 0;
    overflow: hidden;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--sans);
    transition: background .6s, color .6s;
  }

  button {
    font: inherit;
    color: inherit;
  }

  canvas {
    position: fixed;
    inset: 0;
    display: block;
    width: 100%;
    height: 100%;
    touch-action: none;
    cursor: crosshair;
  }

  #formula,
  #panel {
    position: fixed;
    z-index: 2;
    bottom: max(28px, env(safe-area-inset-bottom));
    transition: opacity .4s, transform .4s;
  }

  body.hide #formula,
  body.hide #panel {
    opacity: 0;
    transform: translateY(8px);
    pointer-events: none;
  }

  #formula {
    left: 32px;
    right: 300px;
    display: flex;
    align-items: center;
    gap: 16px;
    font-size: clamp(28px, 4.4vw, 68px);
  }

  #expr {
    min-width: 2ch;
    font: 700 1em / 1.1 var(--sans);
    letter-spacing: -.035em;
    word-break: break-word;
    text-shadow: 0 0 28px var(--bg), 0 0 8px var(--bg);
    outline: none;
    cursor: text;
  }

  #expr .v {
    font-style: italic;
    padding-right: .04em;
  }

  #expr .fn {
    font-weight: 500;
  }

  #expr .n {
    font-variant-numeric: tabular-nums;
  }

  #expr.bad {
    animation: shake .35s;
  }

  @keyframes shake {
    25% { transform: translateX(-6px); }
    75% { transform: translateX(6px); }
  }

  .arrows {
    position: relative;
    top: .1em;
    display: flex;
    flex: none;
    padding: 3px;
    border: 1px solid var(--line);
    border-radius: 999px;
    background: var(--surface);
    backdrop-filter: blur(18px) saturate(1.4);
    -webkit-backdrop-filter: blur(18px) saturate(1.4);
  }

  .arrow {
    display: grid;
    place-items: center;
    width: 48px;
    height: 48px;
    padding: 0;
    border: 0;
    border-radius: 50%;
    background: transparent;
    cursor: pointer;
    transition: background .15s, transform .15s;
  }

  .arrow:hover {
    background: var(--hover);
  }

  .arrow:active {
    transform: scale(.92);
  }

  .arrow svg {
    width: 24px;
    height: 24px;
    fill: none;
    stroke: currentColor;
    stroke-width: 2.25;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  #panel {
    right: 32px;
    width: 236px;
    display: flex;
    flex-direction: column;
    gap: 14px;
    padding: 14px;
    border: 1px solid var(--line);
    border-radius: 14px;
    background: var(--surface);
    backdrop-filter: blur(18px) saturate(1.4);
    -webkit-backdrop-filter: blur(18px) saturate(1.4);
    font-size: 13px;
  }

  .segmented {
    display: flex;
    padding: 3px;
    border-radius: 10px;
    background: var(--hover);
  }

  .segmented button {
    flex: 1;
    height: 30px;
    border: 0;
    border-radius: 7px;
    background: transparent;
    color: var(--muted);
    cursor: pointer;
    transition: background .2s, color .2s;
  }

  .segmented button.on {
    background: var(--ink);
    color: var(--bg);
  }

  .row {
    display: grid;
    grid-template-columns: 36px 1fr 30px;
    align-items: center;
    gap: 10px;
  }

  .row span {
    color: var(--muted);
  }

  .row output {
    text-align: right;
    font-variant-numeric: tabular-nums;
  }

  input[type="range"] {
    width: 100%;
    height: 18px;
    margin: 0;
    background: transparent;
    appearance: none;
    -webkit-appearance: none;
    cursor: pointer;
  }

  input[type="range"]::-webkit-slider-runnable-track {
    height: 2px;
    border-radius: 2px;
    background: linear-gradient(var(--ink), var(--ink)) 0 / var(--p, 50%) 100% no-repeat, var(--line);
  }

  input[type="range"]::-webkit-slider-thumb {
    width: 14px;
    height: 14px;
    margin-top: -6px;
    border: 0;
    border-radius: 50%;
    background: var(--ink);
    -webkit-appearance: none;
    transition: transform .15s;
  }

  input[type="range"]:active::-webkit-slider-thumb {
    transform: scale(1.25);
  }

  input[type="range"]::-moz-range-track {
    height: 2px;
    background: var(--line);
  }

  input[type="range"]::-moz-range-progress {
    height: 2px;
    background: var(--ink);
  }

  input[type="range"]::-moz-range-thumb {
    width: 14px;
    height: 14px;
    border: 0;
    border-radius: 50%;
    background: var(--ink);
  }

  input[type="color"] {
    grid-column: 2 / 4;
    width: 100%;
    height: 28px;
    padding: 0;
    border: 1px solid var(--line);
    border-radius: 7px;
    background: transparent;
    cursor: pointer;
  }

  input[type="color"]::-webkit-color-swatch-wrapper {
    padding: 3px;
  }

  input[type="color"]::-webkit-color-swatch {
    border: 0;
    border-radius: 4px;
  }

  input[type="color"]::-moz-color-swatch {
    border: 0;
    border-radius: 4px;
  }

  button:focus-visible,
  input:focus-visible {
    outline: 2px solid var(--ink);
    outline-offset: 2px;
  }

  @media (max-width: 720px) {
    #formula {
      left: 16px;
      right: 16px;
      bottom: auto;
      top: max(20px, env(safe-area-inset-top));
      flex-direction: column;
      align-items: flex-start;
      gap: 12px;
    }

    .arrows {
      top: 0;
    }

    #panel {
      left: 16px;
      right: 16px;
      bottom: max(16px, env(safe-area-inset-bottom));
      width: auto;
    }
  }
</style>
</head>
<body>
  <canvas id="wind" aria-label="바람 드로잉 캔버스"></canvas>

  <section id="formula">
    <div class="arrows">
      <button class="arrow" type="button" data-next="-1" aria-label="이전 식"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14.5 5l-7 7 7 7"/></svg></button>
      <button class="arrow" type="button" data-next="1" aria-label="다음 식"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9.5 5l7 7-7 7"/></svg></button>
    </div>
    <div id="expr" contenteditable="true" spellcheck="false" role="textbox" aria-label="바람 수식"></div>
  </section>

  <section id="panel"></section>

<script>
  const formulas = [
    "sin(y * 3 + t) + cos(x * 2)",
    "atan2(y, x) + PI / 2 + 0.3",
    "floor(x * 4) * PI / 2 + floor(y * 4) * PI / 3",
    "sin(x * y * 4 + t * 0.5) * PI",
    "hypot(x, y) * 5 - t",
    "round(sin(x * 4 + t)) * PI / 2",
    "cos(3 * x + t * 0.3) * sin(2 * y) * TAU",
    "atan2(y - sin(t) * 0.6, x - cos(t) * 0.6) * 2",
    "atan2(y, x) * 3 + hypot(x, y) * 4",
    "sin(x * 6) * cos(y * 6) * PI + t * 0.2"
  ];

  const palettes = [
    { name: "Dark", bg: "#0b0b12", ink: "#f2f2f7" },
    { name: "Light", bg: "#ffffff", ink: "#14151f" }
  ];

  const calm = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const sliders = [
    { key: "speed", label: "바람", min: 0.3, max: 4, step: 0.1, value: calm ? 0.8 : 1.6 },
    { key: "trail", label: "잔상", min: 1, max: 100, step: 1, value: 30 }
  ];
  const COUNT = calm ? 1500 : 4000;
  const WEIGHT = 1.5;

  const state = { palette: 0, color: "#ff3fa4" };
  const values = {};
  for (let i = 0; i < sliders.length; i++) {
    values[sliders[i].key] = sliders[i].value;
  }

  const wind = document.getElementById("wind");
  const ctx = wind.getContext("2d");
  const exprEl = document.getElementById("expr");
  const formulaEl = document.getElementById("formula");
  const panel = document.getElementById("panel");

  const px = new Float32Array(COUNT);
  const py = new Float32Array(COUNT);
  const ox = new Float32Array(COUNT);
  const oy = new Float32Array(COUNT);
  const vx = new Float32Array(COUNT);
  const vy = new Float32Array(COUNT);
  const age = new Float32Array(COUNT);
  const life = new Float32Array(COUNT);

  let W = 0;
  let H = 0;
  let S = 1;
  let fi = 0;
  let field = null;
  let oldField = null;
  let blendStart = 0;
  let currentExpr = "";
  let paused = false;
  let scrambleTimer = null;
  let fadeDebt = 0;
  const pointer = { down: false, x: 0, y: 0, dx: 0, dy: 0, moved: 0 };

  const now = () => performance.now() / 1000;

  function compile(expr) {
    try {
      const make = new Function(`
        const { sin, cos, tan, atan2, hypot, sqrt, abs, floor, round, min, max, exp, log, pow, sign, PI } = Math;
        const TAU = PI * 2;
        return (x, y, t) => (${expr});
      `);
      const fn = make();
      const test = fn(0.31, -0.27, 1);
      if (typeof test !== "number" || !isFinite(test)) return null;
      return fn;
    } catch (error) {
      return null;
    }
  }

  function useFormula(expr, index) {
    const fn = compile(expr);
    if (!fn) return false;
    oldField = field;
    field = fn;
    blendStart = now();
    currentExpr = expr;
    if (index !== null) fi = index;
    showFormula(expr);
    return true;
  }

  function next(step) {
    const i = (fi + step + formulas.length) % formulas.length;
    useFormula(formulas[i], i);
  }

  const FN = "atan2|sin|cos|tan|hypot|sqrt|abs|floor|round|min|max|exp|log|pow|sign";
  const NUM = "\\d+(?:\\.\\d+)?";

  function pretty(expr) {
    let s = expr
      .replace(new RegExp(`hypot\\(x, y\\) \\* (${NUM})`, "g"), "$1√(x² + y²)")
      .replace(/hypot\(x, y\)/g, "√(x² + y²)")
      .replace(/floor\(([^()]*)\)/g, "⌊$1⌋")
      .replace(new RegExp(`\\b([xyt]) \\* ([xyt]) \\* (${NUM})`, "g"), "$3$1$2")
      .replace(new RegExp(`\\b([xyt]) \\* (${NUM})`, "g"), "$2$1")
      .replace(new RegExp(`\\b(${NUM}) \\* ([xyt])\\b`, "g"), "$1$2")
      .replace(/\bTAU\b/g, "τ")
      .replace(/\bPI\b/g, "π")
      .replace(/ \* /g, "·")
      .replace(/ \/ /g, "/")
      .replace(/-/g, "−");
    const tokens = [];
    const re = new RegExp(`(${FN})|([xytπτ])|(${NUM})|(.)`, "g");
    let m;
    while ((m = re.exec(s))) {
      tokens.push({ text: m[0], cls: m[1] ? "fn" : m[2] ? "v" : m[3] ? "n" : "" });
    }
    return tokens;
  }

  function renderTokens(tokens, done) {
    const glyphs = "xyt+−·0123456789sincoaπ";
    const esc = { "<": "&lt;", ">": "&gt;", "&": "&amp;" };
    let html = "";
    let n = 0;
    for (let i = 0; i < tokens.length; i++) {
      let text = "";
      for (const ch of tokens[i].text) {
        if (n < done || ch === " ") text += esc[ch] || ch;
        else text += glyphs[Math.floor(Math.random() * glyphs.length)];
        n++;
      }
      html += tokens[i].cls ? `<span class="${tokens[i].cls}">${text}</span>` : text;
    }
    exprEl.innerHTML = html;
  }

  function showFormula(expr) {
    clearInterval(scrambleTimer);
    if (document.activeElement === exprEl) return;
    const tokens = pretty(expr);
    const length = tokens.reduce((sum, token) => sum + [...token.text].length, 0);
    let frame = 0;
    scrambleTimer = setInterval(() => {
      frame++;
      renderTokens(tokens, Math.floor(length * frame / 16));
      if (frame >= 16) clearInterval(scrambleTimer);
    }, 28);
  }

  function angleAt(x, y, t) {
    let a = field(x, y, t);
    if (oldField) {
      const u = (now() - blendStart) / 1.4;
      if (u >= 1) {
        oldField = null;
      } else {
        const b = oldField(x, y, t);
        const d = Math.atan2(Math.sin(a - b), Math.cos(a - b));
        const e = u < 0.5 ? 2 * u * u : 1 - Math.pow(-2 * u + 2, 2) / 2;
        a = b + d * e;
      }
    }
    return isFinite(a) ? a : 0;
  }

  function force(X, Y, t) {
    const a = angleAt((X - W / 2) / S, (H / 2 - Y) / S, t);
    let fx = Math.cos(a) * values.speed;
    let fy = -Math.sin(a) * values.speed;
    if (pointer.down) {
      const dx = X - pointer.x;
      const dy = Y - pointer.y;
      const d = Math.sqrt(dx * dx + dy * dy) + 1;
      const swirl = 7 * Math.exp(-d / 170);
      const push = Math.exp(-d / 120);
      fx += (-dy / d) * swirl + pointer.dx * 0.35 * push;
      fy += (dx / d) * swirl + pointer.dy * 0.35 * push;
    }
    return [fx, fy];
  }

  function spawn(i) {
    px[i] = Math.random() * W;
    py[i] = Math.random() * H;
    ox[i] = px[i];
    oy[i] = py[i];
    vx[i] = 0;
    vy[i] = 0;
    age[i] = 0;
    life[i] = 60 + Math.random() * 260;
  }

  function paintBackground(alpha) {
    ctx.globalCompositeOperation = "source-over";
    ctx.globalAlpha = alpha;
    ctx.fillStyle = palettes[state.palette].bg;
    ctx.fillRect(0, 0, W, H);
    ctx.globalAlpha = 1;
  }

  function resize() {
    const dpr = Math.min(2, window.devicePixelRatio || 1);
    W = innerWidth;
    H = innerHeight;
    S = Math.min(W, H) / 2;
    wind.width = Math.round(W * dpr);
    wind.height = Math.round(H * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    paintBackground(1);
    for (let i = 0; i < COUNT; i++) {
      spawn(i);
      age[i] = Math.random() * life[i];
    }
  }

  function step() {
    const t = now() * 0.4;
    const fade = 0.22 / (1 + values.trail * 0.55);

    fadeDebt += fade;
    if (fadeDebt >= 0.05) {
      paintBackground(fadeDebt);
      fadeDebt = 0;
    }

    const path = new Path2D();
    for (let i = 0; i < COUNT; i++) {
      const f = force(px[i], py[i], t);
      vx[i] += (f[0] - vx[i]) * 0.14;
      vy[i] += (f[1] - vy[i]) * 0.14;
      ox[i] = px[i];
      oy[i] = py[i];
      px[i] += vx[i];
      py[i] += vy[i];
      age[i]++;

      if (age[i] > life[i] || px[i] < -20 || px[i] > W + 20 || py[i] < -20 || py[i] > H + 20) {
        spawn(i);
        continue;
      }

      path.moveTo(ox[i], oy[i]);
      path.lineTo(px[i], py[i]);
    }

    ctx.lineCap = "round";
    ctx.lineWidth = WEIGHT;
    ctx.strokeStyle = state.color;
    ctx.stroke(path);
  }

  function burst(x, y) {
    for (let i = 0; i < COUNT; i++) {
      const dx = px[i] - x;
      const dy = py[i] - y;
      const d = Math.sqrt(dx * dx + dy * dy) + 1;
      if (d < 280) {
        vx[i] += dx / d * 16 * (1 - d / 280);
        vy[i] += dy / d * 16 * (1 - d / 280);
      }
    }
  }

  function applyPalette(i) {
    state.palette = i;
    const pal = palettes[i];
    document.documentElement.style.setProperty("--bg", pal.bg);
    document.documentElement.style.setProperty("--ink", pal.ink);
    paintBackground(1);
    for (const b of panel.querySelectorAll("[data-palette]")) {
      b.classList.toggle("on", Number(b.dataset.palette) === i);
      b.setAttribute("aria-pressed", Number(b.dataset.palette) === i);
    }
  }

  function buildPanel() {
    let themes = "";
    for (let i = 0; i < palettes.length; i++) {
      themes += `<button type="button" data-palette="${i}">${palettes[i].name}</button>`;
    }
    let html = `<div class="segmented" role="group" aria-label="화면">${themes}</div>`;

    for (const s of sliders) {
      html += `
        <label class="row">
          <span>${s.label}</span>
          <input type="range" min="${s.min}" max="${s.max}" step="${s.step}" value="${values[s.key]}" data-slider="${s.key}" style="--p: ${(values[s.key] - s.min) / (s.max - s.min) * 100}%">
          <output id="out-${s.key}">${values[s.key]}</output>
        </label>`;
    }

    html += `
      <label class="row">
        <span>색</span>
        <input type="color" value="${state.color}" data-color>
      </label>`;
    panel.innerHTML = html;
  }

  function save() {
    const link = document.createElement("a");
    link.download = `invisible-wind-${Date.now()}.png`;
    link.href = wind.toDataURL("image/png");
    link.click();
  }

  formulaEl.onclick = (e) => {
    const b = e.target.closest("[data-next]");
    if (b) next(Number(b.dataset.next));
  };

  panel.onclick = (e) => {
    const b = e.target.closest("[data-palette]");
    if (b) applyPalette(Number(b.dataset.palette));
  };

  panel.oninput = (e) => {
    if (e.target.dataset.color !== undefined) {
      state.color = e.target.value;
      return;
    }
    const key = e.target.dataset.slider;
    if (!key) return;
    const s = sliders.find((item) => item.key === key);
    values[key] = Number(e.target.value);
    e.target.style.setProperty("--p", `${(values[key] - s.min) / (s.max - s.min) * 100}%`);
    document.getElementById(`out-${key}`).textContent = e.target.value;
  };

  exprEl.onkeydown = (e) => {
    if (e.key === "Enter") {
      e.preventDefault();
      const text = exprEl.textContent.trim();
      const index = formulas.indexOf(text);
      if (useFormula(text, index === -1 ? null : index)) {
        exprEl.blur();
      } else {
        exprEl.classList.remove("bad");
        void exprEl.offsetWidth;
        exprEl.classList.add("bad");
      }
    }
    if (e.key === "Escape") exprEl.blur();
  };
  exprEl.onfocus = () => {
    clearInterval(scrambleTimer);
    if (exprEl.textContent !== currentExpr) {
      exprEl.textContent = currentExpr;
      getSelection().selectAllChildren(exprEl);
      getSelection().collapseToEnd();
    }
  };
  exprEl.onblur = () => {
    exprEl.classList.remove("bad");
    renderTokens(pretty(currentExpr), Infinity);
  };

  wind.onpointerdown = (e) => {
    wind.setPointerCapture(e.pointerId);
    pointer.down = true;
    pointer.x = e.clientX;
    pointer.y = e.clientY;
    pointer.dx = 0;
    pointer.dy = 0;
    pointer.moved = 0;
  };

  wind.onpointermove = (e) => {
    if (!pointer.down) return;
    pointer.dx = e.clientX - pointer.x;
    pointer.dy = e.clientY - pointer.y;
    pointer.moved += Math.abs(pointer.dx) + Math.abs(pointer.dy);
    pointer.x = e.clientX;
    pointer.y = e.clientY;
  };

  wind.onpointerup = wind.onpointercancel = () => {
    if (pointer.down && pointer.moved < 10) burst(pointer.x, pointer.y);
    pointer.down = false;
  };

  window.onkeydown = (e) => {
    if (document.activeElement === exprEl) return;
    const k = e.key.toLowerCase();
    if (e.key === " ") {
      e.preventDefault();
      paused = !paused;
    }
    if (e.key === "ArrowRight") next(1);
    if (e.key === "ArrowLeft") next(-1);
    if (k === "p") applyPalette((state.palette + 1) % palettes.length);
    if (k === "c") paintBackground(1);
    if (k === "s") save();
    if (k === "h") document.body.classList.toggle("hide");
    if (k === "f") {
      if (document.fullscreenElement) document.exitFullscreen();
      else document.documentElement.requestFullscreen().catch(() => {});
    }
  };

  let resizeTimer;
  window.onresize = () => {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(resize, 150);
  };

  function loop() {
    if (!paused) step();
    requestAnimationFrame(loop);
  }

  buildPanel();
  applyPalette(0);
  resize();
  useFormula(formulas[0], 0);
  requestAnimationFrame(loop);
</script>
</body>
</html>
